# Garde IP grossière : les 80 tentatives des tests restent sous le burst.
# La limitation précise par e-mail est appliquée dans auth.
limit_req_zone $binary_remote_addr zone=login_ip:10m rate=50r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $auth_upstream auth:8000;
    set $catalog_upstream catalog:8000;
    client_max_body_size 16k;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout;

    # Hérités par toutes les routes publiques et par la sous-requête interne.
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";

    location = /v1/auth/login {
        auth_request off;
        limit_req zone=login_ip burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://$auth_upstream$request_uri;
    }

    location = /.well-known/jwks.json {
        auth_request off;
        proxy_pass http://$auth_upstream$request_uri;
    }

    location = /v1/auth/verify {
        return 404;
    }

    location = /_auth {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_pass http://$auth_upstream/v1/auth/verify;
    }

    location /v1/ {
        auth_request /_auth;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Role $user_role;
        # Intercepter l'erreur locale d'auth_request, conserver les 500 de l'amont.
        proxy_intercept_errors off;
        error_page 500 =503 @auth_unavailable;
        proxy_pass http://$catalog_upstream$request_uri;
    }

    location /v1/stream/ {
        auth_request /_auth;
        auth_request_set $stream_user_id $upstream_http_x_user_id;
        auth_request_set $stream_user_role $upstream_http_x_user_role;
        proxy_set_header X-User-Id $stream_user_id;
        proxy_set_header X-User-Role $stream_user_role;
        proxy_intercept_errors off;
        error_page 500 =503 @auth_unavailable;
        proxy_buffering off;
        proxy_pass http://$catalog_upstream$request_uri;
    }

    location @auth_unavailable {
        return 503;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
