[project]
name = "market-catalog"
version = "0.1.0"
description = "Service catalog de Market"
requires-python = ">=3.12"
# Client MongoDB asynchrone natif de pymongo (pas motor), GraphQL Strawberry, serveur uvicorn.
dependencies = [
    "market-common",
    "pymongo>=4.20.0",
    "strawberry-graphql>=0.341.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_catalog"]

[tool.uv.sources]
market-common = { workspace = true }
