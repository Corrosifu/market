[project]
name = "market-order"
version = "0.1.0"
description = "Service order de Market"
requires-python = ">=3.12"
# Les dépendances d'exécution (FastAPI, SQLAlchemy, ...) s'ajoutent avec l'implémentation du service.
dependencies = ["market-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_order"]

[tool.uv.sources]
market-common = { workspace = true }
