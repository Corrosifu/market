[project]
name = "market-delivery"
version = "0.1.0"
description = "Service delivery de Market"
requires-python = ">=3.12"
# Les dépendances d'exécution (FastAPI, SQLAlchemy, ...) s'ajoutent avec l'accord de l'humain.
dependencies = ["market-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_delivery"]

[tool.uv.sources]
market-common = { workspace = true }
