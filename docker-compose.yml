name: market

services:
  postgres:
    image: postgres:16.8-alpine
    profiles: [core]
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: market
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:?}
      REALTIME_DB_PASSWORD: ${REALTIME_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d market -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mongo:
    image: mongo:7.0.18
    profiles: [core]
    mem_limit: 768m
    command: [mongod, --bind_ip_all, --wiredTigerCacheSizeGB, "0.25"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    profiles: [core]
    mem_limit: 1536m
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  gateway:
    image: nginx:1.28.0-alpine
    profiles: [core]
    mem_limit: 128m
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/nginx/index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
