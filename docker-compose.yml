name: market

services:
  postgres:
    image: postgres:16.8-alpine
    profiles: [core]
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: market
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:?}
      REALTIME_DB_PASSWORD: ${REALTIME_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d market -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mongo:
    image: mongo:7.0.18
    profiles: [core]
    mem_limit: 768m
    command: [mongod, --bind_ip_all, --wiredTigerCacheSizeGB, "0.25"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    profiles: [core]
    mem_limit: 1536m
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    profiles: [core]
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: market
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      JWT_ISSUER: ${JWT_ISSUER:?}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?}
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:?}
      DEMO_SELLER_PASSWORD: ${DEMO_SELLER_PASSWORD:?}
      DEMO_OPS_PASSWORD: ${DEMO_OPS_PASSWORD:?}
      AUTH_MAX_FAILURES: ${AUTH_MAX_FAILURES:-10}
      AUTH_FAILURE_WINDOW_SECONDS: ${AUTH_FAILURE_WINDOW_SECONDS:-300}
      AUTH_FAILURE_MAX_ENTRIES: ${AUTH_FAILURE_MAX_ENTRIES:-10000}
      AUTH_HASH_CONCURRENCY: ${AUTH_HASH_CONCURRENCY:-2}
      AUTH_HASH_MAX_WAITING: ${AUTH_HASH_MAX_WAITING:-16}
      AUTH_HASH_WAIT_TIMEOUT_SECONDS: ${AUTH_HASH_WAIT_TIMEOUT_SECONDS:-0.25}
      AUTH_HASH_RETRY_AFTER_SECONDS: ${AUTH_HASH_RETRY_AFTER_SECONDS:-1}
    secrets:
      - source: jwt_private
        target: jwt_private.pem
      - source: jwt_public
        target: jwt_public.pem
    tmpfs:
      - /run/keys:rw,noexec,nosuid,size=1m,mode=0700
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    profiles: [core]
    mem_limit: 256m
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # MongoDB sans authentification en S1 (limite assumée, README du catalogue) : l'URL ne porte aucun secret.
      MONGO_URL: mongodb://mongo:27017/market
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    profiles: [core]
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-market}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    profiles: [core]
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-market}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    profiles: [core]
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-market}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?}
      INVENTORY_URL: ${INVENTORY_URL:-http://inventory:8000}
      PAYMENT_URL: ${PAYMENT_URL:-http://payment:8000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-1}
      INVENTORY_TIMEOUT_SECONDS: ${INVENTORY_TIMEOUT_SECONDS:-1}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-0.1}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-3}
      BREAKER_RESET_SECONDS: ${BREAKER_RESET_SECONDS:-5}
      BULKHEAD_MAX_CONCURRENT: ${BULKHEAD_MAX_CONCURRENT:-20}
      SAGA_STUCK_SECONDS: ${SAGA_STUCK_SECONDS:-60}
      SAGA_RECOVERY_INTERVAL_SECONDS: ${SAGA_RECOVERY_INTERVAL_SECONDS:-10}
      ORDER_STUB_UNIT_PRICE_GBP: ${ORDER_STUB_UNIT_PRICE_GBP:-10.00}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-1}
      KAFKA_DELIVERY_TIMEOUT_SECONDS: ${KAFKA_DELIVERY_TIMEOUT_SECONDS:-5}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  gateway:
    image: nginx:1.28.0-alpine
    profiles: [core]
    mem_limit: 128m
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/nginx:/etc/nginx/conf.d:ro
      - ./gateway/nginx/index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  mongo-data:
  kafka-data:

secrets:
  jwt_private:
    file: ./infra/secrets/jwt_private.pem
  jwt_public:
    file: ./infra/secrets/jwt_public.pem
